<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Finalize Your Appointment | Margo's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050a06; color: white; }
        .btn-premium { background: linear-gradient(45deg, #d4af37, #f4d03f); color: #050a06; font-weight: 800; border-radius: 50px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full p-10 border border-white/10 rounded-3xl bg-white/5 backdrop-blur-md">
        <h1 class="text-3xl font-bold text-[#d4af37] mb-6 text-center">Confirm Details</h1>
        
        <form id="scheduleForm" class="space-y-4">
            <input type="hidden" id="cust_email">
            
            <div>
                <label class="block text-xs font-bold uppercase opacity-60 mb-1">Full Name</label>
                <input type="text" id="cust_name" required class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase opacity-60 mb-1">Best Contact Number</label>
                <input type="tel" id="cust_phone" required class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase opacity-60 mb-1">Address Line 1</label>
                <input type="text" id="addr1" required class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase opacity-60 mb-1">Address Line 2 (Apt/Suite)</label>
                <input type="text" id="addr2" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase opacity-60 mb-1">Date</label>
                    <input type="date" id="book_date" required class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase opacity-60 mb-1">Time</label>
                    <input type="time" id="book_time" required class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-[#d4af37]">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-premium w-full py-4 mt-4">Confirm Appointment</button>
        </form>

        <div id="confirmMsg" class="hidden text-center mt-6">
            <h3 class="text-[#d4af37] font-bold text-xl">Success!</h3>
            <p class="text-sm text-gray-400 mt-2">Mike has been notified. Check your email for confirmation.</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxbH71m6-Vw4pObH65D7HXhnvvuVZ4VRaiV9ffcK1qkQKlqRia6MD7mLONsKq_39REI7Q/exec';
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('cust_email').value = urlParams.get('email') || "";
        document.getElementById('cust_name').value = urlParams.get('name') || "";

        document.getElementById('scheduleForm').addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "Processing...";

            const data = {
                type: 'SCHEDULE',
                name: document.getElementById('cust_name').value,
                email: document.getElementById('cust_email').value,
                phone: document.getElementById('cust_phone').value,
                address1: document.getElementById('addr1').value,
                address2: document.getElementById('addr2').value,
                date: document.getElementById('book_date').value,
                time: document.getElementById('book_time').value
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain' }})
            .then(() => {
                document.getElementById('scheduleForm').classList.add('hidden');
                document.getElementById('confirmMsg').classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
