<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalize Your Appointment | Margo's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050a06; 
            color: white; 
            /* Prevent horizontal scroll */
            overflow-x: hidden; 
        }
        .btn-premium { 
            background: linear-gradient(45deg, #d4af37, #f4d03f); 
            color: #050a06; 
            font-weight: 800; 
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .btn-premium:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        /* Glassmorphism effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Remove mobile zoom on focus by ensuring font-size is at least 16px */
        input, select, textarea {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="flex items-start md:items-center justify-center min-h-screen p-4 sm:p-8">
    
    <div class="glass-card w-full max-w-2xl rounded-[2rem] p-6 sm:p-10 md:p-12 shadow-2xl my-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-[#d4af37] tracking-tight">Confirm Details</h1>
            <p class="text-gray-400 mt-2 text-sm sm:text-base">Please verify your information to secure your spot.</p>
        </header>
        
        <form id="scheduleForm" class="space-y-5 sm:space-y-6">
            <input type="hidden" id="cust_email">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                <!-- Name Field -->
                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Full Name</label>
                    <input type="text" id="cust_name" required 
                        placeholder="John Doe"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all placeholder:opacity-20">
                </div>

                <!-- Phone Field -->
                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Best Contact Number</label>
                    <input type="tel" id="cust_phone" required 
                        placeholder="(555) 000-0000"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all placeholder:opacity-20">
                </div>
            </div>

            <!-- Address Fields -->
            <div class="space-y-5">
                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Address Line 1</label>
                    <input type="text" id="addr1" required 
                        placeholder="Street address"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all placeholder:opacity-20">
                </div>

                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Address Line 2 (Apt/Suite)</label>
                    <input type="text" id="addr2" 
                        placeholder="Optional"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all placeholder:opacity-20">
                </div>
            </div>

            <!-- Date and Time -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Date</label>
                    <input type="date" id="book_date" required 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all appearance-none">
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-[#d4af37] mb-2 px-1">Time</label>
                    <input type="time" id="book_time" required 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all appearance-none">
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                class="btn-premium w-full py-5 rounded-2xl text-lg uppercase tracking-widest mt-4 shadow-lg">
                Confirm Appointment
            </button>
        </form>

        <!-- Success Message -->
        <div id="confirmMsg" class="hidden text-center py-10 animate-pulse">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#d4af37]/20 mb-4">
                <svg class="w-8 h-8 text-[#d4af37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-[#d4af37] font-extrabold text-2xl sm:text-3xl">Success!</h3>
            <p class="text-gray-400 mt-3 max-w-xs mx-auto">Mike has been notified. Check your email for confirmation details.</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxbH71m6-Vw4pObH65D7HXhnvvuVZ4VRaiV9ffcK1qkQKlqRia6MD7mLONsKq_39REI7Q/exec';
        
        // Populate fields from URL parameters
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('email')) document.getElementById('cust_email').value = urlParams.get('email');
            if(urlParams.get('name')) document.getElementById('cust_name').value = urlParams.get('name');
        };

        document.getElementById('scheduleForm').addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            // UI Loading State
            btn.disabled = true; 
            btn.innerHTML = `
                <span class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                </span>
            `;

            const data = {
                type: 'SCHEDULE',
                name: document.getElementById('cust_name').value,
                email: document.getElementById('cust_email').value,
                phone: document.getElementById('cust_phone').value,
                address1: document.getElementById('addr1').value,
                address2: document.getElementById('addr2').value,
                date: document.getElementById('book_date').value,
                time: document.getElementById('book_time').value
            };

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(data), 
                headers: { 'Content-Type': 'text/plain' }
            })
            .then(() => {
                document.getElementById('scheduleForm').classList.add('hidden');
                document.getElementById('confirmMsg').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .catch(err => {
                console.error('Error:', err);
                btn.disabled = false;
                btn.innerText = "Confirm Appointment";
                // Note: Standard practice would be to show a custom toast/modal here
            });
        });
    </script>
</body>
</html>
